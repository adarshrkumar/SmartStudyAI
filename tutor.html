<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor - SmartStudyAI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container tutor-container">
      <header class="app-header">
        <a href="features.html" class="back-button">← Back to page</a>
        <h2>SMARTSTUDYAI Tutor</h2>
        <div class="feedback-button">
          <button type="button" aria-label="Feedback">😊</button>
          <span>Feedback</span>
        </div>
      </header>

      <main class="tutor-interface">
        <div class="input-options">
          <textarea
            placeholder="Type message here..."
            aria-label="Type your question for the tutor"
          ></textarea>
          <span class="option-divider">or</span>
          <button class="upload-button" type="button">
            Upload Images
            <span class="upload-icon" aria-hidden="true">↑</span>
            <!-- Replace with actual SVG/icon -->
          </button>
        </div>
      </main>

      <footer class="app-footer">
        <a href="#" class="btn btn-premium">Get Premium</a>
      </footer>
    </div>
  </body>
</html>
