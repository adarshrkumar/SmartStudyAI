<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Welcome - SmartStudyAI</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Link to your CSS file -->
  </head>
  <body>
    <div class="container welcome-container">
      <header class="app-header">
        <!-- Optional: Add a logo or back button if needed on this specific screen -->
        <div class="feedback-button">
          <button type="button" aria-label="Feedback">😊</button>
          <span>Feedback</span>
        </div>
      </header>

      <main class="welcome-content">
        <h1>WELCOME TO SMARTSTUDYAI</h1>
        <div class="mascot-area">
          <!-- Placeholder for the robot mascot SVG or image -->
          <svg
            width="200"
            height="150"
            viewBox="0 0 200 150"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Simplified representation of the mascot area -->
            <rect
              x="50"
              y="20"
              width="100"
              height="100"
              fill="#d3d3d3"
              rx="10"
            />

            <circle cx="125" cy="50" r="5" fill="#333" />
            <rect x="70" y="70" width="60" height="10" fill="#aaa" rx="5" />
            <text
              x="100"
              y="140"
              text-anchor="middle"
              font-size="10"
              fill="#555"
            >
              Mascot Placeholder
            </text>
          </svg>
        </div>
        <div class="action-buttons">
          <a href="register.html" class="btn btn-primary">Create an account</a>
          <a href="login.html" class="btn btn-secondary">Login</a>
          <a href="features.html" class="btn btn-tertiary">Get Started</a>

    </div>
