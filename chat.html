<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - SmartStudyAI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container chat-container">
      <header class="app-header">
        <a href="features.html" class="back-button">← Back to page</a>
        <h2>SMARTSTUDYAI Chat</h2>
        <div class="feedback-button">
          <button type="button" aria-label="Feedback">😊</button>
          <span>Feedback</span>
        </div>
      </header>

      <main class="chat-interface">
        <div class="message-display-area">
          <!-- Chat messages will be loaded here -->
          <div class="message bot-message">
            Welcome to SmartStudyAI Chat! How may I help you?
          </div>
        </div>
        <div class="message-input-area">
          <input
            type="text"
            placeholder="Type message..."
            aria-label="Chat message input"
          />
          <button type="submit" class="send-button">Send</button>
        </div>
      </main>

      <footer class="app-footer">
        <a href="#" class="btn btn-premium">Get Premium</a>
      </footer>
    </div>
  </body>
</html>
